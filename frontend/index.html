<!DOCTYPE html>
<html>
<head>
    <title>Azure Student App</title>
    <style>
        .badge {
            display: inline-block;
            padding: 5px 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            color: white;
            margin-left: 10px;
        }
        .cache {
            background-color: #28a745; /* Green for Redis */
        }
        .database {
            background-color: #007bff; /* Blue for Database */
        }
    </style>
</head>

<body>

    <h1>Student Management Application</h1>

    <form id="studentForm">
        <label>Name:</label>
        <input type="text" id="name" required>
        <br><br>

        <label>Email:</label>
        <input type="email" id="email" required>
        <br><br>

        <label>Course:</label>
        <input type="text" id="course" required>
        <br><br>

        <button type="submit">Submit</button>
    </form>

    <h2>
        Students 
        <span id="cacheStatus" class="badge"></span>
    </h2>

    <div id="students"></div>

    <script>
        const API_URL = "/api";

        document.getElementById("studentForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const name = document.getElementById("name").value;
            const email = document.getElementById("email").value;
            const course = document.getElementById("course").value;

            const response = await fetch(API_URL + "/students", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    name,
                    email,
                    course
                })
            });

            const data = await response.json();

            alert(data.message || "Student added");

            // Reset form fields
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("course").value = "";

            loadStudents();
        });

        async function loadStudents() {
            const response = await fetch(API_URL + "/students");
            const result = await response.json();

            const badge = document.getElementById("cacheStatus");

            // Update badge text and color depending on response source
            if (result.source === "cache") {
                badge.textContent = " Loaded from Redis Cache";
                badge.className = "badge cache";
            } else {
                badge.textContent = " Loaded from PostgreSQL Database";
                badge.className = "badge database";
            }

            // Render students list
            document.getElementById("students").innerHTML =
                result.data.map(student => `
                    <p>
                        <strong>${student.name}</strong> -
                        ${student.email} -
                        ${student.course}
                    </p>
                `).join("");
        }

        loadStudents();
    </script>

</body>
</html>
