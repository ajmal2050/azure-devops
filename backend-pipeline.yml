trigger:
  branches:
    include:
      - main
  paths:
    include:
      - backend/**

pool:
  vmImage: ubuntu-latest

variables:
  imageTag: '$(Build.BuildId)'

steps:

# ==========================================
# BUILD AND PUSH BACKEND IMAGE TO ACR
# ==========================================

- checkout: self

- task: Docker@2
  displayName: 'Build and Push Backend'
  inputs:
    containerRegistry: 'ACR-Service-Connection'
    repository: 'backend'
    command: 'buildAndPush'
    Dockerfile: 'backend/Dockerfile'
    buildContext: 'backend'
    tags: |
      $(imageTag)
      latest

# ==========================================
# DEPLOY BACKEND, POSTGRES, & REDIS TO PRIVATE VM
# ==========================================

- task: AzureCLI@2
  displayName: 'Deploy Backend Stack to Private VM'
  inputs:
    azureSubscription: 'Azure-Service-Connection'
    scriptType: bash
    scriptLocation: inlineScript
    inlineScript: |

      az vm run-command invoke \
        --resource-group devops-resrce \
        --name backend-vm \
        --command-id RunShellScript \
        --scripts "

          set -e

          echo 'Logging into Azure using VM managed identity...'
          az login --identity

          echo 'Logging into Azure Container Registry...'
          az acr login --name acrcontainerproject123

          echo 'Ensuring Docker network app-net exists...'
          docker network create app-net || true

          echo '1. Starting PostgreSQL Container...'
          if ! docker ps -a --format '{{.Names}}' | grep -q '^postgres$'; then
            docker run -d \
              --name postgres \
              --network app-net \
              --restart unless-stopped \
              -e POSTGRES_DB=DB-VAR \
              -e POSTGRES_USER=USER-VAR \
              -e POSTGRES_PASSWORD='DB-PASS' \
              -v postgres_data:/var/lib/postgresql/data \
              postgres:15-alpine
          else
            echo 'Postgres container already exists, ensuring it is running...'
            docker start postgres
          fi

          echo '2. Starting Redis Container...'
          if ! docker ps -a --format '{{.Names}}' | grep -q '^redis$'; then
            docker run -d \
              --name redis \
              --network app-net \
              --restart unless-stopped \
              redis:7-alpine
          else
            echo 'Redis container already exists, ensuring it is running...'
            docker start redis
          fi

          echo '3. Pulling and Updating Backend Container...'
          docker pull acrcontainerproject123.azurecr.io/backend:$(Build.BuildId)

          docker stop backend || true
          docker rm backend || true

          docker run -d \
            --name backend \
            --network app-net \
            --restart unless-stopped \
            -e DB_HOST=postgres \
            -e DB_NAME=DB-VAR \
            -e DB_USER=USER-VAR \
            -e DB_PASSWORD='DB-PASS' \
            -e REDIS_URL=redis://redis:6379 \
            -p 5000:5000 \
            acrcontainerproject123.azurecr.io/backend:$(Build.BuildId)

          echo 'Waiting for services to settle...'
          sleep 10

          echo 'Running containers:'
          docker ps

          echo 'Backend health check:'
          curl http://localhost:5000/health || true

          echo ''
          echo 'Backend deployment stack completed successfully.'

        "
